name: Auto Process and Commit

on:
  push:
    branches: [ main ]
    paths:
      - '*.py'           # Chạy khi file Python thay đổi
      - '*.sql'          # Chạy khi file SQL thay đổi
  workflow_dispatch:     # Cho phép chạy thủ công

permissions:
  contents: write       # Quan trọng! Cho phép commit

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Lấy toàn bộ lịch sử commit
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort pylint
    
    - name: Format Python code
      run: |
        echo "Formatting Python files..."
        black .
        isort .
    
    - name: Check for changes
      id: verify-changed
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected:"
          git diff --stat
        fi
    
    - name: Commit changes
      if: steps.verify-changed.outputs.changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.sec.samsung.net"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Auto-format Python code [skip ci]" || echo "No changes to commit"
        git push || echo "No changes to push"
    
    - name: Generate summary
      run: |
        echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Changes:** ${{ steps.verify-changed.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Files formatted:** $(git diff --name-only HEAD~1 HEAD | wc -l)" >> $GITHUB_STEP_SUMMARY
